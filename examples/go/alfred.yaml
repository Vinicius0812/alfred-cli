version: 1

project:
  name: example-go-api

commit:
  convention: conventional
  allowed_types: [feat, fix, docs, refactor, test, chore, perf]
  scopes: [api, database, infrastructure]
  protected_branches: [main]
  confirm_push: true

docker:
  compose_files:
    - compose.yaml

workflows:
  test:
    description: Run unit tests
    steps:
      - command: go
        args: [test, ./...]
        risk: read

  check:
    description: Format, vet, and test the project
    steps:
      - command: gofmt
        args: [-w, .]
        risk: local-write
      - command: go
        args: [vet, ./...]
        risk: read
      - command: go
        args: [test, ./...]
        risk: read

policies:
  require_clean_worktree: true
  confirm_destructive_actions: true
