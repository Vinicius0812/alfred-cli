version: 1

project:
  name: example-node-web

commit:
  convention: conventional
  allowed_types: [feat, fix, docs, refactor, test, chore]
  scopes: [app, api, ui, dependencies]
  protected_branches: [main]
  confirm_push: true

docker:
  compose_files:
    - compose.yaml
  profiles:
    - development

workflows:
  setup:
    description: Install project dependencies
    steps:
      - command: npm
        args: [ci]
        risk: network

  check:
    description: Run linting and tests
    steps:
      - command: npm
        args: [run, lint]
        risk: read
      - command: npm
        args: [test]
        risk: read

policies:
  confirm_destructive_actions: true
