name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: test
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          platforms=(
            "windows amd64"
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for platform in "${platforms[@]}"; do
            read -r goos goarch <<< "$platform"
            name="alfred_${VERSION}_${goos}_${goarch}"
            output="dist/${name}/alfred"

            if [[ "$goos" == "windows" ]]; then
              output="${output}.exe"
            fi

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X github.com/Vinicius0812/alfred-cli/internal/cli.Version=${VERSION}" \
              -o "$output" \
              ./cmd/alfred

            if [[ "$goos" == "windows" ]]; then
              (cd "dist/${name}" && zip -q "../${name}.zip" alfred.exe)
            else
              tar -C "dist/${name}" -czf "dist/${name}.tar.gz" alfred
            fi
          done

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/checksums.txt \
              --title "$VERSION" \
              --notes "Alfred CLI ${VERSION}"
          fi
