name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag in vMAJOR.MINOR.PATCH format"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release reference
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Validate version and tag
        id: version
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/validate-version.sh "$VERSION"

          tag_commit="$(git rev-list -n 1 "$VERSION")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "release tag $VERSION does not point to the checked out commit" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Test release source
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs:
      - validate
      - test
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build release artifacts and SBOMs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          platforms=(
            "windows amd64"
            "windows arm64"
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for platform in "${platforms[@]}"; do
            read -r goos goarch <<< "$platform"
            name="alfred_${VERSION}_${goos}_${goarch}"
            output="dist/${name}/alfred"

            if [[ "$goos" == "windows" ]]; then
              output="${output}.exe"
            fi

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X github.com/Vinicius0812/alfred-cli/internal/cli.Version=${VERSION}" \
              -o "$output" \
              ./cmd/alfred

            go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
              bin \
              -json \
              -noserial \
              -version "$VERSION" \
              -output "dist/${name}.cdx.json" \
              "$output"

            if [[ "$goos" == "windows" ]]; then
              (cd "dist/${name}" && zip -q "../${name}.zip" alfred.exe)
            else
              tar -C "dist/${name}" -czf "dist/${name}.tar.gz" alfred
            fi
          done

          actual_version="$("dist/alfred_${VERSION}_linux_amd64/alfred" --version)"
          if [[ "$actual_version" != "alfred ${VERSION}" ]]; then
            echo "unexpected binary version: $actual_version" >&2
            exit 1
          fi

          cp scripts/install.ps1 scripts/install.sh dist/
          (cd dist && sha256sum -- *.tar.gz *.zip *.cdx.json install.ps1 install.sh > checksums.txt)
          bash scripts/release-notes.sh "$VERSION" CHANGELOG.md > dist/release-notes.md

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json
            dist/checksums.txt
            dist/install.ps1
            dist/install.sh

      - name: Publish release without overwriting assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; refusing to replace published assets" >&2
            exit 1
          fi

          gh release create "$VERSION" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*.cdx.json \
            dist/checksums.txt \
            dist/install.ps1 \
            dist/install.sh \
            --verify-tag \
            --title "$VERSION" \
            --notes-file dist/release-notes.md

  smoke:
    name: Verify published ${{ matrix.os }} release
    runs-on: ${{ matrix.runner }}
    needs:
      - validate
      - release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-amd64
            runner: ubuntu-latest
            archive: linux_amd64.tar.gz
          - os: windows-amd64
            runner: windows-latest
            archive: windows_amd64.zip
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download published release files
        shell: bash
        env:
          ARCHIVE_SUFFIX: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          archive="alfred_${VERSION}_${ARCHIVE_SUFFIX}"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --pattern checksums.txt
          printf '%s' "$archive" > archive-name.txt

      - name: Verify checksum and provenance
        shell: bash
        run: |
          set -euo pipefail
          archive="$(cat archive-name.txt)"
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"

      - name: Smoke test Linux binary and installer
        if: matrix.os == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(cat archive-name.txt)"
          tar -xzf "$archive"
          [[ "$(./alfred --version)" == "alfred ${VERSION}" ]]
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern install.sh
          ALFRED_VERSION="$VERSION" ALFRED_INSTALL_DIR="$RUNNER_TEMP/alfred-bin" sh install.sh
          [[ "$("$RUNNER_TEMP/alfred-bin/alfred" --version)" == "alfred ${VERSION}" ]]

      - name: Smoke test Windows binary and installer
        if: matrix.os == 'windows-amd64'
        shell: pwsh
        run: |
          $archive = Get-Content -LiteralPath archive-name.txt -Raw
          Expand-Archive -LiteralPath $archive -DestinationPath extracted
          $actual = & (Join-Path $PWD "extracted/alfred.exe") --version
          if ($actual -cne "alfred $env:VERSION") { throw "Unexpected version: $actual" }
          gh release download $env:VERSION --repo $env:GITHUB_REPOSITORY --pattern install.ps1
          $installDir = Join-Path $env:RUNNER_TEMP "alfred-bin"
          & ./install.ps1 -Version $env:VERSION -InstallDir $installDir -NoPathUpdate
          $installed = & (Join-Path $installDir "alfred.exe") --version
          if ($installed -cne "alfred $env:VERSION") { throw "Unexpected installed version: $installed" }
